name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/TechPulse-Database
      TECHPULSE_SIM_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/techpulse_sim
      TECHPULSE_DATABASE_NAME: techpulse_sim
      TECHPULSE_EXPECTED_DATABASE: TechPulse-Database
      TECHPULSE_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/techpulse_sim_test
      TECHPULSE_TEST_DATABASE_NAME: techpulse_sim_test
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Create isolated application and test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "TechPulse-Database"'
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE techpulse_sim"
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE techpulse_sim_test"
      - name: Apply research schema migrations
        run: python -m techpulse.cli db-migrate
      - name: Build and persist the reproducible simulation experiment
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/techpulse_sim
        run: python -m src.run_all
      - name: Apply isolated simulation test migrations
        run: python -m src.db.migrate --test
      - name: Run tests
        run: python -m pytest tests/ -v

