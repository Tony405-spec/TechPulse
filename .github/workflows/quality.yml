name: TechPulse quality gates (static)

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Check formatting
        run: python -m black --check dashboard/app.py src/feature_engineering.py tests/test_dashboard_modes.py
      - name: Check lint
        run: python -m flake8 dashboard/app.py src/feature_engineering.py tests/test_dashboard_modes.py
      - name: Compile Python modules
        run: python -m compileall -q src techpulse dashboard tests
